name: Dockerized Test Pipeline

on:
  push:
    branches:
      - main
      - 'task-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dockerized-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/test-runner

jobs:
  dockerized-tests:
    name: Build image and run concise tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build reusable test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          load: true
          push: false
          tags: local/test-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run build, tests, and 100% coverage gate
        run: |
          rm -rf coverage
          mkdir -p .ci-artifacts
          container_name="traffic-sim-test-${{ github.run_id }}"
          docker run \
            --name "$container_name" \
            -e CI=true \
            -e COVERAGE_THRESHOLD=100 \
            local/test-runner:${{ github.sha }}
          docker cp "$container_name:/app/coverage" .ci-artifacts/coverage
          docker rm "$container_name" >/dev/null

      - name: Push reusable test image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: .ci-artifacts/coverage/
          if-no-files-found: ignore
          retention-days: 14
